<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Acesso do Cliente</title>
    <!-- Importação de fontes e ícones (Material Icons / Google Fonts) para perfeita harmonia com o CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Link para o seu arquivo CSS (ajuste o caminho se necessário) -->
    <link rel="stylesheet" href="./estilo.css">
    
    <style>
        /* Estilos adicionais específicos para centralizar e dar acabamento refinado ao card de login usando as variáveis do CSS */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(31, 60, 20, 0.05), rgba(77, 112, 43, 0.12)), 
                        url("https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1900&q=80") center / cover no-repeat;
        }

        .login-container {
            width: min(92%, 460px);
            padding: 40px 36px;
            background-color: var(--branco);
            border-radius: 22px;
            box-shadow: var(--sombra-forte);
            border: 1px solid var(--borda);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            margin-bottom: 14px;
            border-radius: 50%;
            background-color: var(--verde-claro);
            color: var(--verde);
            font-size: 28px;
        }

        .login-header h1 {
            margin: 0 0 8px;
            color: var(--verde-escuro);
            font-family: "Playfair Display", Georgia, serif;
            font-size: 2rem;
            font-weight: 800;
        }

        .login-header p {
            margin: 0;
            color: var(--texto-claro);
            font-size: 0.93rem;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--texto);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--verde-medio);
            font-size: 20px;
        }

        .input-wrapper input {
            width: 100%;
            height: 48px;
            padding: 0 14px 0 44px;
            border: 1px solid var(--borda);
            border-radius: 10px;
            background-color: var(--creme);
            color: var(--texto);
            font-size: 0.95rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--verde-medio);
            background-color: var(--branco);
            box-shadow: 0 0 0 3px rgba(77, 112, 43, 0.15);
        }

        .login-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 0.86rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--texto-claro);
            cursor: pointer;
        }

        .forgot-pass {
            color: var(--verde-medio);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s ease;
        }

        .forgot-pass:hover {
            color: var(--verde);
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 10px;
            background-color: var(--verde);
            color: var(--branco);
            font-size: 0.98rem;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: var(--verde-medio);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .login-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.88rem;
            color: var(--texto-claro);
            border-top: 1px solid var(--borda);
            padding-top: 20px;
        }

        .login-footer a {
            color: var(--verde-escuro);
            font-weight: 800;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <i class="material-icons">eco</i>
            </div>
            <h1>Bem-vindo de volta</h1>
            <p>Entre com suas credenciais para acessar sua conta e acompanhar seus pedidos.</p>
        </div>

        <form id="formEntrar">
            <div class="input-group">
                <label for="email">E-mail</label>
                <div class="input-wrapper">
                    <i class="material-icons">mail_outline</i>
                    <input id="email" type="email" name="email" placeholder="seu.email@exemplo.com" required autocomplete="email">
                </div>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <div class="input-wrapper">
                    <i class="material-icons">lock_outline</i>
                    <input id="senha" type="password" name="senha" placeholder="Sua senha secreta" required autocomplete="current-password">
                </div>
            </div>

            <div class="login-actions">
                <label class="remember-me">
                    <input type="checkbox" name="lembrar"> Lembrar de mim
                </label>
                <a href="#" class="forgot-pass">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-submit">Acessar</button>
        </form>

        <div class="login-footer">
            Ainda não tem uma conta? <a href="#">Cadastre-se</a>
        </div>
    </main>

    <script src="./entrar.js"></script>
</body>
</html>
