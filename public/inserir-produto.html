<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto - Painel Administrativo</title>
    
    <!-- Google Fonts (Apenas DM Sans - sem serifa) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        /* =========================================================
           VARIÁVEIS (Referência do CSS fornecido)
           ========================================================= */
        :root {
            --verde: #31511f;
            --verde-escuro: #203817;
            --verde-medio: #4d702b;
            --verde-claro: #edf5e8;
            --lima: #a8df65;
            --creme: #f8f7f1;
            --branco: #ffffff;
            --texto: #24331d;
            --texto-claro: #687261;
            --borda: #dce7d3;
            --sombra: 0 10px 30px rgba(27, 48, 20, 0.10);
            --sombra-forte: 0 18px 45px rgba(15, 35, 10, 0.20);
        }

        /* =========================================================
           BASE
           ========================================================= */
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            color: var(--texto);
            background-color: var(--verde-claro);
            font-family: "DM Sans", Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        input, button {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        img {
            max-width: 100%;
        }

        /* Container Principal */
        .admin-container {
            width: min(100%, 650px);
            background-color: var(--branco);
            border-radius: 22px;
            border: 1px solid var(--borda);
            box-shadow: var(--sombra-forte);
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header com Verde Escuro Sólido */
        .admin-header {
            position: relative;
            padding: 32px 36px 24px;
            background-color: var(--verde-escuro);
            color: var(--branco);
            border-bottom: 3px solid var(--verde);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 14px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--lima);
        }

        .admin-header h1 {
            margin: 0 0 6px;
            font-family: "DM Sans", Arial, Helvetica, sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .admin-header p {
            margin: 0;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Formulário */
        form {
            padding: 36px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            color: var(--verde-escuro);
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        label span {
            color: var(--verde-medio);
        }

        input[type="text"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid var(--borda);
            border-radius: 10px;
            background-color: var(--creme);
            color: var(--texto);
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input[type="file"] {
            padding: 10px;
            background-color: var(--branco);
            cursor: pointer;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: var(--verde-medio);
            background-color: var(--branco);
            box-shadow: 0 0 0 3px rgba(77, 112, 43, 0.12);
        }

        /* Alerta de Sucesso Oculto */
        .form-alert {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            margin-bottom: 24px;
            background-color: var(--verde-claro);
            border: 1px solid var(--borda);
            border-radius: 8px;
            color: var(--verde-escuro);
            font-size: 0.9rem;
            font-weight: 700;
        }

        /* Botão de Envio com Base na Cor Lima */
        .btn-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 50px;
            margin-top: 10px;
            border: 0;
            border-radius: 10px;
            background-color: var(--lima);
            color: var(--verde-escuro);
            font-size: 1rem;
            font-weight: 800;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(168, 223, 101, 0.3);
        }

        .btn-submit:hover {
            background-color: #96cd56;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(168, 223, 101, 0.4);
        }

        /* Responsividade */
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            form, .admin-header {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="admin-container">
        <div class="admin-header">
            <a href="#" class="back-link">
                <span class="material-icons" style="font-size: 16px;">arrow_back</span> Voltar ao Início
            </a>
            <h1>Novo Produto</h1>
            <p>Insira os dados do item para adicioná-lo ao catálogo oficial.</p>
        </div>

        <form id="formProduto" enctype="multipart/form-data">
            
            <div class="form-alert" id="successAlert">
                <span class="material-icons" style="font-size: 20px;">check_circle</span>
                Produto cadastrado com sucesso!
            </div>

            <div class="form-grid">
                
                <div class="form-group full-width">
                    <label for="name">Nome do produto <span>*</span></label>
                    <input id="name" type="text" name="name" placeholder="Ex: Alface Orgânica Crespa" required>
                </div>

                <div class="form-group full-width">
                    <label for="image">Imagem do produto <span>*</span></label>
                    <input type="file" id="image" name="image" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label for="category">Categoria do produto <span>*</span></label>
                    <input id="category" type="text" name="category" placeholder="Ex: Hortifrúti" required>
                </div>

                <div class="form-group">
                    <label for="categoryLabel">Label do produto <span>*</span></label>
                    <input id="categoryLabel" type="text" name="categoryLabel" placeholder="Ex: Fresco do dia" required>
                </div>

                <div class="form-group">
                    <label for="unit">Unidade de medida <span>*</span></label>
                    <input id="unit" type="text" name="unit" placeholder="Ex: Maço" required>
                </div>

                <div class="form-group">
                    <label for="badge">Etiqueta do produto <span>*</span></label>
                    <input id="badge" type="text" name="badge" placeholder="Ex: Orgânico" required>
                </div>

                <div class="form-group">
                    <label for="price">Preço atual <span>*</span></label>
                    <input id="price" type="text" name="price" placeholder="Ex: R$ 4,99" required>
                </div>

                <div class="form-group">
                    <label for="oldPrice">Preço antigo <span>*</span></label>
                    <input id="oldPrice" type="text" name="oldPrice" placeholder="Ex: R$ 6,50" required>
                </div>

                <div class="form-group full-width">
                    <button type="submit" class="btn-submit">
                        <span class="material-icons" style="font-size: 20px;">add_circle_outline</span>
                        Cadastrar produto
                    </button>
                </div>

            </div>
        </form>
    </main>

    <script src="./product.js"></script>
</body>

</html>
